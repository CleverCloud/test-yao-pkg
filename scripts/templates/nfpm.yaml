name: "clever-tools"
platform: "linux"
maintainer: "Clever Cloud"
description: "Command Line Interface for Clever Cloud."
vendor: "Clever Cloud"
license: "Apache-2.0"

contents:
  - src: "build/main/linux/clever"
    dst: "/usr/bin/clever"
    file_info:
      mode: 0755

overrides:
  rpm:
    arch: "x86_64"
    version: "${VERSION}"
    signature:
      key_file: "/tmp/signing-key.asc"
  deb:
    arch: "amd64"
    version: "1.0.0-${VERSION}"