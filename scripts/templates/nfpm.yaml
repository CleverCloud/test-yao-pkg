name: "clever-tools"
arch: "x86_64"
platform: "linux"
version: "${VERSION}"
maintainer: "Clever Cloud"
description: "Command Line Interface for Clever Cloud."
vendor: "Clever Cloud"
license: "Apache-2.0"

contents:
  - src: "build/main/linux/clever"
    dst: "/usr/bin/clever"
    file_info:
      mode: 0755

rpm:
  signature:
    key_file: "/tmp/signing-key.asc"

overrides:
  deb:
    arch: "amd64"
    version: "1.0.0-${VERSION}"