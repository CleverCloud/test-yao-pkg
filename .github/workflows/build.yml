name: Build

on:
  push:
    branches: [ main ]

jobs:
  bundle-single-cjs:
    name: 'Bundle to single .cjs'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Bundle to single .cjs'
        run: |
          mkdir -p build
          cp index.js build/index.cjs
      - name: 'Upload .cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-single-cjs
          path: build/index.cjs
          retention-days: 1

  build-linux:
    needs: bundle-single-cjs
    name: 'Build linux binary'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download .cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-single-cjs
          path: build/
      - name: 'Build linux binary'
        run: cp build/index.cjs build/index-linux
      - name: 'Create .tar.gz'
        run: tar czf index-linux.tar.gz index-linux
        working-directory: build
      - name: 'Generate SHA256 checksum file'
        run: sha256sum build/index-linux.tar.gz > build/index-linux.tar.gz.sha256
      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            build/index-linux.tar.gz
            build/index-linux.tar.gz.sha256
          retention-days: 1

  build-mac:
    needs: bundle-single-cjs
    name: 'Build mac binary'
    runs-on: macos-14
    steps:
      - name: 'Download .cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-single-cjs
          path: build/
      - name: 'Build mac binary'
        run: cp build/index.cjs build/index-mac
      - name: 'Create .tar.gz'
        run: tar czf index-mac.tar.gz index-mac
        working-directory: build
      - name: 'Generate SHA256 checksum file'
        run: shasum -a 256 build/index-mac.tar.gz > build/index-mac.tar.gz.sha256
      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: |
            build/index-mac.tar.gz
            build/index-mac.tar.gz.sha256
          retention-days: 1

  build-windows:
    needs: bundle-single-cjs
    name: 'Build windows binary'
    runs-on: windows-latest
    steps:
      - name: 'Download .cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-single-cjs
          path: build/
      - name: 'Build windows binary'
        run: cp build/index.cjs build/index-win.exe
      - name: 'Create .zip'
        run: Compress-Archive -Path build/index-win.exe -DestinationPath build/index-win.zip
        shell: pwsh
      - name: 'Generate SHA256 checksum file'
        run: |
          $hash = (Get-FileHash -Path build/index-win.zip -Algorithm SHA256).Hash.ToLower()
          "$hash *index-win.zip" | Out-File -FilePath build/index-win.zip.sha256 -Encoding ascii
        shell: pwsh
      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            build/index-win.zip
            build/index-win.zip.sha256
          retention-days: 1

  publish-preview:
    needs: [build-linux, build-mac, build-windows]
    name: 'Publish Preview'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download all artifacts'
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: build/
      - name: 'List all artifacts'
        run: ls -la build/
