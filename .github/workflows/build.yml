name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      include-windows:
        type: boolean
        default: true
        description: 'Whether to include Windows in the build matrix'

jobs:
  bundle-cjs:
    name: 'Bundle single clever.cjs'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Bundle to single clever.cjs'
        run: ./scripts/bundle-cjs.js ${{ inputs.version }}
      - name: 'Upload bundle-cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-cjs
          path: build
          retention-days: 1

  build-linux:
    name: 'Build for linux'
    needs: bundle-cjs
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create archive'
        shell: bash
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-linux artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build
          retention-days: 1

  build-macos:
    name: 'Build for macos'
    needs: bundle-cjs
    runs-on: macos-14
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create archive'
        shell: bash
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-macos artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build
          retention-days: 1

  build-windows:
    name: 'Build for windows'
    needs: bundle-cjs
    runs-on: windows-latest
    if: ${{ inputs.include-windows }}
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create archive'
        shell: bash
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-win artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-win
          path: build
          retention-days: 1
