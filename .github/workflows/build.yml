name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      include-windows:
        type: boolean
        default: true
        description: 'Whether to include Windows in the build matrix'

jobs:
  bundle-cjs:
    name: 'Bundle single clever.cjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: 'Bundle to single clever.cjs'
        run: ./scripts/bundle-cjs.js ${{ inputs.version }}
      - name: 'Upload bundle-cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-cjs
          path: build/**/clever.cjs
          retention-days: 1

  build-linux:
    name: 'Build for linux'
    needs: bundle-cjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/download-artifacts
        with: { pattern: bundle-cjs }
      - name: 'Build binary'
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create archive'
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-linux binary'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-binary
          path: build/**/clever
          retention-days: 1
      - name: 'Upload build-linux archive'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-archive
          path: build/**/*.tar.gz
          retention-days: 1
          compression-level: 0

  build-macos:
    name: 'Build for macos'
    needs: bundle-cjs
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/download-artifacts
        with: { pattern: bundle-cjs }
      - name: 'Build binary'
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create archive'
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-macos archive'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-archive
          path: build/**/*.tar.gz
          retention-days: 1
          compression-level: 0

  build-windows:
    name: 'Build for windows'
    needs: bundle-cjs
    runs-on: windows-latest
    if: ${{ inputs.include-windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/download-artifacts
        with: { pattern: bundle-cjs }
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create archive'
        shell: bash
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-win archive'
        uses: actions/upload-artifact@v4
        with:
          name: build-win-archive
          path: build/**/*.zip
          retention-days: 1
          compression-level: 0
