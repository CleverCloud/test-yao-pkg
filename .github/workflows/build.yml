name: Build

on:
  workflow_call:

jobs:
  bundle-cjs:
    name: 'Bundle single clever.cjs'
    runs-on: ubuntu-latest
    env:
      CLEVER_CJS_PATH: build/${{ env.VERSION }}/clever.cjs
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Bundle to single clever.cjs'
        run: rollup -c rollup.config.js -o ${{ env.CLEVER_CJS_PATH }}
      - name: 'Upload bundle-cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: 'bundle-cjs'
          path: build
          retention-days: 1

  build-binaries:
    needs: bundle-cjs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            binary-name: clever
          - os: macos-14
            os-name: mac
            binary-name: clever
          - os: windows-latest
            os-name: windows
            binary-name: clever.exe
    name: 'Build ${{ matrix.os-name }} binary'
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'test'
        shell: bash
        run: ls *
