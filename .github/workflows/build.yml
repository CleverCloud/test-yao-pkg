name: Build

on:
  push:
    branches: [ main ]

jobs:
  bundle-rollup:
    name: 'Bundle to single .cjs'
    runs-on: ubuntu-latest
    steps:
      - name: 'foo'
        run: |
          sleep 10
          echo cellar
  build-packaged-binary:
    needs: bundle-rollup
    name: 'Build packaged binary'
    runs-on: ubuntu-latest
    steps:
      - name: 'foo'
        run: |
          sleep 10
          echo rpm-on-nexus
  create-archives:
    needs: build-packaged-binary
    name: 'Create .tar.gz and .zip archives'
    runs-on: ubuntu-latest
    steps:
      - name: 'foo'
        run: |
          sleep 10
          echo deb-on-nexus
  generate-checksums:
    needs: create-archives
    name: 'Generate checksums'
    runs-on: ubuntu-latest
    steps:
      - name: 'foo'
        run: |
          sleep 5
          echo nupkg-on-nexus
