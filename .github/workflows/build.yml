name: Build

on:
  push:
    branches: [ main ]

jobs:
  bundle-single-cjs:
    name: 'Bundle to single .cjs'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Bundle to single .cjs'
        run: |
          mkdir -p build
          cp index.js build/index.cjs
      - name: 'Upload .cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-cjs
          path: build/index.cjs
          retention-days: 1

  build-linux-binary:
    needs: bundle-single-cjs
    name: 'Build linux binary'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download .cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build/
      - name: 'Build linux binary'
        run: cp build/index.cjs build/index-linux
      - name: 'Upload binary artifact'
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: build/index-linux
          retention-days: 1

  build-mac-binary:
    needs: bundle-single-cjs
    name: 'Build mac binary'
    runs-on: macos-14
    steps:
      - name: 'Download .cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build/
      - name: 'Build mac binary'
        run: cp build/index.cjs build/index-mac
      - name: 'Upload binary artifact'
        uses: actions/upload-artifact@v4
        with:
          name: binary-mac
          path: build/index-mac
          retention-days: 1
