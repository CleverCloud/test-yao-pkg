name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      node-version:
        type: string
        default: node22

jobs:
  bundle-cjs:
    name: 'Bundle single clever.cjs'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Bundle to single clever.cjs'
        run: ./scripts/bundle-cjs.js ${{ inputs.version }}
      - name: 'Upload bundle-cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-cjs
          path: build
          retention-days: 1

  build-linux:
    name: 'Build for linux'
    needs: bundle-cjs
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create .tar.gz'
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-linux artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build
          retention-days: 1

  build-mac:
    name: 'Build for mac'
    needs: bundle-cjs
    runs-on: macos-14
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create .tar.gz'
        shell: bash
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-mac artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: build
          retention-days: 1

  build-windows:
    name: 'Build for windows'
    needs: bundle-cjs
    runs-on: windows-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: ./scripts/build-binary.js ${{ inputs.version }}
      - name: 'Create .zip'
        shell: bash
        run: ./scripts/create-archive.js ${{ inputs.version }}
      - name: 'Upload build-windows artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build
          retention-days: 1
