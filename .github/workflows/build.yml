name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  bundle-cjs:
    name: 'Bundle single clever.cjs'
    runs-on: ubuntu-latest
    env:
      CLEVER_CJS_PATH: build/${{ inputs.version }}/clever.cjs
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Bundle to single clever.cjs'
        run: npx rollup -c rollup.config.js -o ${{ env.CLEVER_CJS_PATH }}
      - name: 'Upload bundle-cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-cjs
          path: build
          retention-days: 1

  build-binaries:
    needs: bundle-cjs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            binary-name: clever
            platform: x64
          - os: macos-14
            os-name: mac
            binary-name: clever
            platform: arm64
          - os: windows-latest
            os-name: win
            binary-name: clever.exe
            platform: x64
    name: 'Build ${{ matrix.os-name }} binary'
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build ${{ matrix.os-name }} binary'
        shell: bash
        run: npx pkg -t node22-${{ matrix.os-name }}-${{ matrix.platform }} build/${{ inputs.version }}/clever.cjs -o build/${{ inputs.version }}/${{ matrix.os-name }}/${{ matrix.binary-name }}
      - name: 'Upload build-${{ matrix.os-name }} artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os-name }}
          path: build
          retention-days: 1

  archive-checksum:
    needs: build-binaries
    name: 'Create archives and checksums'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download build artifacts'
        uses: actions/download-artifact@v4
        with: { pattern: build-* }
      - name: 'test'
        run: tree
