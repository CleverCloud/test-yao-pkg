name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  bundle-cjs:
    name: 'Bundle single clever.cjs'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Bundle to single clever.cjs'
        run: npx rollup -c rollup.config.js -o build/${{ inputs.version }}/clever.cjs
      - name: 'Upload bundle-cjs artifact'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-cjs
          path: build
          retention-days: 1

  build-linux:
    name: 'Build linux binary'
    needs: bundle-cjs
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: npx pkg -t node22-linux-x64 build/${{ inputs.version }}/clever.cjs -o build/${{ inputs.version }}/linux/clever
      - name: 'Create .tar.gz'
        working-directory: build/${{ inputs.version }}/linux
        run: tar czf clever-tools_linux.tar.gz clever
      - name: 'Create checksum file'
        working-directory: build/${{ inputs.version }}/linux
        run: sha256sum clever-tools_linux.tar.gz > clever-tools_linux.tar.gz.sha256
      - name: 'Upload build-linux artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build
          retention-days: 1

  build-mac:
    needs: bundle-cjs
    name: 'Build mac binary'
    runs-on: macos-14
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: npx pkg -t node22-mac-arm64 build/${{ inputs.version }}/clever.cjs -o build/${{ inputs.version }}/mac/clever
      - name: 'Create .tar.gz'
        shell: bash
        working-directory: build/${{ inputs.version }}/mac
        run: zip clever-tools_win.zip clever.exe
      - name: 'Create checksum file'
        shell: bash
        working-directory: build/${{ inputs.version }}/mac
        run: shasum -a 256 clever-tools_linux.tar.gz > clever-tools_linux.tar.gz.sha256
      - name: 'Upload build-mac artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: build
          retention-days: 1

  build-windows:
    needs: bundle-cjs
    name: 'Build windows binary'
    runs-on: windows-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download bundle-cjs artifact'
        uses: actions/download-artifact@v4
        with:
          name: bundle-cjs
          path: build
      - name: 'Build binary'
        shell: bash
        run: npx pkg -t node22-win-x64 build/${{ inputs.version }}/clever.cjs -o build/${{ inputs.version }}/win/clever.exe
      - name: 'Create .tar.gz'
        shell: bash
        working-directory: build/${{ inputs.version }}/win
        run: zip clever-tools_win.zip clever.exe
      - name: 'Create checksum file'
        shell: bash
        working-directory: build/${{ inputs.version }}/win
        run: sha256sum clever-tools_win.zip > clever-tools_win.zip.sha256
      - name: 'Upload build-windows artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build
          retention-days: 1
