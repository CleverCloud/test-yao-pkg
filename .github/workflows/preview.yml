name: Preview

#on:
#  workflow_dispatch:
#  push:
#    branches: [ main ]

on:
  pull_request:
    types:
      - synchronize
      - opened
      - closed

env:
  CC_CLEVER_TOOLS_PREVIEWS_CELLAR_KEY_ID: ${{ secrets.CC_CLEVER_TOOLS_PREVIEWS_CELLAR_KEY_ID }}
  CC_CLEVER_TOOLS_PREVIEWS_CELLAR_SECRET_KEY: ${{ secrets.CC_CLEVER_TOOLS_PREVIEWS_CELLAR_SECRET_KEY }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.pull_request.head.ref }}

  publish:
    needs: build
    name: 'Publish preview'
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'synchronize' || github.event.action == 'opened')
      && github.event.repository.fork == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Download build artifacts'
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: build
          merge-multiple: true
      - name: 'Publish preview'
        run: ./scripts/preview.js publish ${{ github.event.pull_request.head.ref }}
      - name: 'Prepare PR comment'
        id: preview-links
        run: |
          echo "links<<EOF" >> $GITHUB_OUTPUT
          ./scripts/preview.js pr-comment ${{ github.event.pull_request.head.ref }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: 'Add comment with preview links to PR'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.preview-links.outputs.links }}

  delete:
    name: 'Delete Preview'
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'closed'
      && github.event.repository.fork == false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }
      - name: 'Install Node.js dependencies'
        shell: bash
        run: npm ci
      - name: 'Delete preview'
        run: ./scripts/preview.js delete ${{ github.event.pull_request.head.ref }}
      - name: 'Remove comment from PR'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: 🔎 The preview has been automatically deleted.
