name: Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: 1.2.3

  publish:
    needs: build
    name: 'Publish preview'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          pattern: archive-checksum-*
      - name: 'List all artifacts'
        run: ls -la *
