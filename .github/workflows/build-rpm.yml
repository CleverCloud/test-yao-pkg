name: Build RPM

on:
  push:
    branches:
      - main

env:
  RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
  RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}

jobs:
  build-rpm:
    name: 'Build .rpm'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Install nfpm'
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz | tar -xz
          sudo mv nfpm /usr/local/bin/
          chmod +x /usr/local/bin/nfpm
      - name: 'Prepare GPG key for signing'
        run: |
          echo "$RPM_GPG_PRIVATE_KEY" > /tmp/signing-key.asc
        env:
          NFPM_RPM_PASSPHRASE: ${{ env.RPM_GPG_PASSPHRASE }}
      - name: 'Build and sign RPM with nfpm'
        run: |
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          nfpm package --packager rpm --target .
        env:
          NFPM_RPM_PASSPHRASE: ${{ env.RPM_GPG_PASSPHRASE }}
      - name: 'Upload RPM artifact'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: "*.rpm"
          retention-days: 1
