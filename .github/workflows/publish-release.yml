name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build.yml

  cellar:
    needs: [build]
    name: 'Publish to Cellar'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          pattern: archive-checksum-*
      - name: 'List all artifacts'
        run: ls -la *

  rpm-nexus:
    needs: [build]
    name: 'Publish RPM to Nexus'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          name: archive-checksum-linux
      - name: 'List all artifacts'
        run: ls -la *

  deb-nexus:
    needs: [build]
    name: 'Publish DEB to Nexus'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          name: archive-checksum-linux
      - name: 'List all artifacts'
        run: ls -la *

  nupkg-nexus:
    needs: [build]
    name: 'Publish NuPkg to Nexus'
    runs-on: windows-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          name: archive-checksum-windows
      - name: 'List all artifacts'
        run: ls -la *

  homebrew:
    needs: [build]
    name: 'Publish to Homebrew'
    runs-on: macos-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          name: archive-checksum-mac
      - name: 'List all artifacts'
        run: ls -la *

  exherbo:
    needs: [build]
    name: 'Publish to Exherbo'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          name: archive-checksum-linux
      - name: 'List all artifacts'
        run: ls -la *

  docker-hub:
    needs: [build]
    name: 'Publish to Docker Hub'
    runs-on: ubuntu-latest
    steps:
      - name: 'foo'
        run: echo foo

  archlinux:
    needs: [build]
    name: 'Publish to Arch Linux'
    runs-on: ubuntu-latest
    steps:
      - name: 'Download archives'
        uses: actions/download-artifact@v4
        with:
          name: archive-checksum-linux
      - name: 'List all artifacts'
        run: ls -la *

  npm:
    needs: [build]
    name: 'Publish to npm'
    runs-on: ubuntu-latest
