name: Release

on:
  push:
    branches:
      - main
# on:
#   push:
#     tags:
#       - '*'

env:
  NFPM_VERSION: "2.43.0"
  RPM_FILENAME: "clever-tools-${{ github.ref_name }}.rpm"
  DEB_FILENAME: "clever-tools-${{ github.ref_name }}.deb"
  NEXUS_SERVER_URL: "https://nexus.clever-cloud.com"
  NEXUS_RPM_REPOSITORY: "rpm-test"
  NEXUS_DEB_REPOSITORY: "deb-test"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  build-rpm:
    name: 'Build .rpm'
    needs: build
    runs-on: ubuntu-latest
    env:
      RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
      NFPM_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build
      - name: 'Download nfpm'
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v${{ env.NFPM_VERSION }}/nfpm_${{ env.NFPM_VERSION }}_Linux_x86_64.tar.gz | tar -xz
          chmod +x nfpm
      - name: 'Build and sign .rpm with nfpm'
        run: |
          echo "$RPM_GPG_PRIVATE_KEY" > /tmp/signing-key.asc
          ./nfpm package --config scripts/templates/nfpm.yaml --packager rpm --target ${{ env.RPM_FILENAME }}
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: "x86_64"
      - name: 'Upload .rpm artifact'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ${{ env.RPM_FILENAME }}
          retention-days: 1

  build-deb:
    name: 'Build .deb'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build
      - name: 'Download nfpm'
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v${{ env.NFPM_VERSION }}/nfpm_${{ env.NFPM_VERSION }}_Linux_x86_64.tar.gz | tar -xz
          chmod +x nfpm
      - name: 'Build .deb with nfpm'
        run: |
          ./nfpm package --config scripts/templates/nfpm.yaml --packager deb --target ${{ env.DEB_FILENAME }}
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: "amd64"
      - name: 'Upload .deb artifact'
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ${{ env.DEB_FILENAME }}
          retention-days: 1

