name: Release

on:
  push:
    branches:
      - main
      - 3.0.0
# on:
#   push:
#     tags:
#       - '*'

env:
  NFPM_VERSION: "2.43.0"
  RPM_FILENAME: "clever-tools-${{ github.ref_name }}.rpm"
  DEB_FILENAME: "clever-tools-${{ github.ref_name }}.deb"
  NEXUS_SERVER_URL: "https://nexus.clever-cloud.com"
  NEXUS_RPM_REPOSITORY: "rpm-test"
  NEXUS_DEB_REPOSITORY: "deb-test"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  build-rpm:
    name: 'Build .rpm'
    needs: build
    runs-on: ubuntu-latest
    if: false
    env:
      RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
      NFPM_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build
      - name: 'Download nfpm'
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v${{ env.NFPM_VERSION }}/nfpm_${{ env.NFPM_VERSION }}_Linux_x86_64.tar.gz | tar -xz
          chmod +x nfpm
      - name: 'Build and sign .rpm with nfpm'
        run: |
          echo "$RPM_GPG_PRIVATE_KEY" > /tmp/signing-key.asc
          ./nfpm package --config scripts/templates/nfpm.yaml --packager .rpm --target ${{ env.RPM_FILENAME }}
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: "x86_64"
      - name: 'Upload .rpm artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-rpm
          path: ${{ env.RPM_FILENAME }}
          retention-days: 1

  build-deb:
    name: 'Build .deb'
    needs: build
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build
      - name: 'Download nfpm'
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v${{ env.NFPM_VERSION }}/nfpm_${{ env.NFPM_VERSION }}_Linux_x86_64.tar.gz | tar -xz
          chmod +x nfpm
      - name: 'Build .deb with nfpm'
        run: |
          ./nfpm package --config scripts/templates/nfpm.yaml --packager .deb --target ${{ env.DEB_FILENAME }}
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: "amd64"
      - name: 'Upload .deb artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-deb
          path: ${{ env.DEB_FILENAME }}
          retention-days: 1

  publish-npm:
    name: 'Publish to npm'
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: 'Publish to npm'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cellar-archives:
    name: 'Publish archives to cellar'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build
      - name: 'Download build-macos artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: build
      - name: 'Download build-win artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-win
          path: build
      - name: 'Publish archives to cellar'
        run: ./scripts/publish-cellar.js ${{ github.ref_name }} archives
        env:
          CC_CLEVER_TOOLS_RELEASES_CELLAR_KEY_ID: ${{ secrets.CC_CLEVER_TOOLS_RELEASES_CELLAR_KEY_ID }}
          CC_CLEVER_TOOLS_RELEASES_CELLAR_SECRET_KEY: ${{ secrets.CC_CLEVER_TOOLS_RELEASES_CELLAR_SECRET_KEY }}

  publish-cellar-rpm:
    name: 'Publish .rpm to cellar'
    needs: build-rpm
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download .rpm artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-rpm
          path: build/${{ github.ref_name }}
      - name: 'Publish .rpm to cellar'
        run: ./scripts/publish-cellar.js ${{ github.ref_name }} rpm
        env:
          CC_CLEVER_TOOLS_RELEASES_CELLAR_KEY_ID: ${{ secrets.CC_CLEVER_TOOLS_RELEASES_CELLAR_KEY_ID }}
          CC_CLEVER_TOOLS_RELEASES_CELLAR_SECRET_KEY: ${{ secrets.CC_CLEVER_TOOLS_RELEASES_CELLAR_SECRET_KEY }}

  publish-cellar-deb:
    name: 'Publish .deb to cellar'
    needs: build-deb
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download .deb artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-deb
          path: build/${{ github.ref_name }}
      - name: 'Publish .deb to cellar'
        run: ./scripts/publish-cellar.js ${{ github.ref_name }} deb
        env:
          CC_CLEVER_TOOLS_RELEASES_CELLAR_KEY_ID: ${{ secrets.CC_CLEVER_TOOLS_RELEASES_CELLAR_KEY_ID }}
          CC_CLEVER_TOOLS_RELEASES_CELLAR_SECRET_KEY: ${{ secrets.CC_CLEVER_TOOLS_RELEASES_CELLAR_SECRET_KEY }}

  publish-aur:
    name: 'Publish to AUR'
    needs: publish-cellar-archives
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup SSH key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build
      - name: 'Publish to AUR'
        run: ./scripts/publish-aur.js ${{ github.ref_name }}

  publish-homebrew:
    name: 'Publish to Homebrew'
    needs: publish-cellar-archives
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup SSH key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Download build-linux artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: build
      - name: 'Publish to Homebrew'
        run: ./scripts/publish-homebrew.js ${{ github.ref_name }}

  publish-dockerhub:
    name: 'Publish to Docker Hub'
    needs: publish-cellar-archives
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup SSH key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Publish to Docker Hub (and related GitHub project)'
        run: ./scripts/publish-dockerhub.js ${{ github.ref_name }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-exherbo:
    name: 'Publish to exherbo'
    needs: publish-cellar-archives
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
      - name: 'Setup SSH key'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: 'Install Node.js dependencies'
        run: npm ci
      - name: 'Publish to GitHub for exherbo'
        run: ./scripts/publish-exherbo.js ${{ github.ref_name }}

  publish-nexus-rpm:
    name: 'Publish .rpm to Nexus'
    needs: build-rpm
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Download .rpm artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-rpm
          path: ./
      - name: 'Publish .rpm to Nexus Repository'
        run: |
          HTTP_STATUS=$(curl -X PUT \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            --data-binary "@${{ env.RPM_FILENAME }}" \
            "${{ env.NEXUS_SERVER_URL }}/repository/${{ env.NEXUS_RPM_REPOSITORY }}/${{ env.RPM_FILENAME }}" \
            -v \
            -w "%{http_code}" \
            -o /dev/null \
            -s)
          echo "HTTP Status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Error: Upload failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "RPM upload successful with status $HTTP_STATUS"
  publish-nexus-deb:
    name: 'Publish .deb to Nexus'
    needs: build-deb
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 'Download .deb artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-deb
          path: ./
      - name: 'Publish .deb to Nexus Repository'
        run: |
          HTTP_STATUS=$(curl -X POST \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            -H "Content-Type: multipart/form-data" \
            -F "data=@${{ env.DEB_FILENAME }}" \
            "${{ env.NEXUS_SERVER_URL }}/repository/${{ env.NEXUS_DEB_REPOSITORY }}/" \
            -v \
            -w "%{http_code}" \
            -o /dev/null \
            -s)
          echo "HTTP Status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Error: Upload failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "DEB upload successful with status $HTTP_STATUS"
